<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="index.js"></script>
    <title>Task Management App</title>
</head>
<body>
    <main id="main">
        <!-- Filters -->
        <div id="filters">
            <select id="statusFilter">
              <option value="All">All</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          
            <input id="categoryFilter" type="text" placeholder="Filter by category" />
        </div>
    
        <!-- Inputs for new task -->
        <div id="inputs">
            <input id="taskName" type="text" placeholder="Task name">
            <input id="category" type="text" placeholder="Category">
            <input id="deadline" type="text" placeholder="MM/DD/YYYY">
            <button id="addTask" onclick="addNewTask()">Add Task</button>
        </div>
                
            <!-- Task list -->
            <ul id="taskList" class="taskList">
                <!-- Header row -->
            </ul>
    </main>
    
</body>
</html>
